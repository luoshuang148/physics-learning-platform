spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:zhixuewuli}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
app:
  video:
    storage-path: ${VIDEO_STORAGE_PATH:./data/videos}
    access-path: /videos
    max-file-size: 524288000
  security:
    cors-allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
ai:
  context:
    enabled: ${AI_ENABLED:false}
