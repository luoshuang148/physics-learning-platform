server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1

spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 2s
      timeout: 2s
      repositories:
        enabled: false
  # RabbitMQ 批量报告消息（镜像版本固定，凭据只从环境变量读取）
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: ${RABBITMQ_PREFETCH:2}
        concurrency: ${RABBITMQ_CONCURRENCY:2}
        auto-startup: ${REPORT_BATCH_ENABLED:true}
  config:
    import: "optional:file:.env[.properties]"
  profiles:
    active: dev
  application:
    name: zhixuewuli-backend
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 520MB
  cache:
    type: simple
    cache-names:
      - questionCache
      - userCache
      - reportCache
    redis:
      time-to-live: 3600000  # 1小时
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 8
    baseline-description: Pre-Flyway V7 schema
    validate-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate              # 各环境只校验，建表及升级通过 SQL 显式执行
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false
        order_updates: true
        batch_versioned_data: true
        order_inserts: true
        jdbc:
          batch_size: 25
          fetch_size: 50

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs  # OpenAPI JSON 端点路径（相对于 context-path）
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# Actuator监控配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: never
  prometheus:
    metrics:
      export:
        enabled: true
  info:
    build:
      enabled: true
    git:
      enabled: true
    env:
      enabled: true

# 默认日志级别（环境配置文件可覆盖）
logging:
  level:
    com.zhixuewuli: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.hibernate: WARN
    com.zaxxer.hikari: INFO

app:
  bootstrap-teacher:
    enabled: ${BOOTSTRAP_TEACHER_ENABLED:false}
    username: ${BOOTSTRAP_TEACHER_USERNAME:}
    password: ${BOOTSTRAP_TEACHER_PASSWORD:}
  # 批量学生报告（RabbitMQ + Outbox）业务参数
  report-batch:
    enabled: ${REPORT_BATCH_ENABLED:true}
    max-students-per-batch: ${REPORT_BATCH_MAX_STUDENTS:100}
    max-active-batches-per-teacher: 5
    item-max-attempts: 3
    item-lease: 6m
    retry-base-delay: 30s
    retry-max-delay: 10m
    publish-interval: 5s
    publish-batch-size: 20
    publish-lease: 30s
    outbox-max-attempts: 20
    publish-confirm-timeout: 10s
    pending-delivery-timeout: 6m
    recover-interval: 30s
    recover-batch-size: 50
    model-timeout: 5m
    main-exchange: report.batch.exchange
    main-queue: report.batch.item.queue
    main-routing-key: report.batch.item
    dead-letter-exchange: report.batch.dlx
    dead-letter-queue: report.batch.item.dlq
    dead-letter-routing-key: report.batch.item.dead
  # 知识库 / 题库向量检索（对应 KnowledgeProperties）
  # 环境变量见 .env.dev.example：APP_KNOWLEDGE_ENABLED、APP_KNOWLEDGE_QDRANT_URL 等。
  # 注意：已配置开关 ≠ 实际模型/向量调用成功，运行状态见 GET /ai/capabilities。
  knowledge:
    enabled: ${APP_KNOWLEDGE_ENABLED:false}
    storage-path: ${APP_KNOWLEDGE_STORAGE_PATH:data/knowledge}
    qdrant-url: ${APP_KNOWLEDGE_QDRANT_URL:http://localhost:6333}
    qdrant-api-key: ${APP_KNOWLEDGE_QDRANT_API_KEY:}
    embedding-model: ${APP_KNOWLEDGE_EMBEDDING_MODEL:bge-small-zh-v1.5-quantized}
    embedding-dimensions: ${APP_KNOWLEDGE_EMBEDDING_DIMENSIONS:512}
    index-workers: ${APP_KNOWLEDGE_INDEX_WORKERS:2}
    allow-lexical-fallback: ${APP_KNOWLEDGE_ALLOW_LEXICAL_FALLBACK:false}
  # LaTeX服务配置
  latex:
    strict-mode: true
    auto-standardization: true
    unit-standards:
      standardize-units: true
      add-space-between-number-and-unit: true
      default-unit-font: "\\mathrm"
    math-symbol-standards:
      standardize-multiplication: true
      standardize-division: true
      standardize-angles: true

  # 安全配置 (对应 SecurityProperties)
  security:
    jwt-expiration: 86400000
    jwt-expiration-ms: 86400000
    cors-max-age: 3600
    csrf-enabled: false
    security-enabled: true
    cors-allowed-origins:
      - "*"
    cors-allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - PATCH
      - OPTIONS
    cors-allowed-headers:
      - "*"
    cors-allow-credentials: true
    auth-exclude-paths:
      - /auth/login
      - /auth/register
      - /swagger-ui/**
      - /v1/api-docs/**
      - /webjars/**
    session-exclude-paths:
      - /swagger-ui/**
      - /v1/api-docs/**
      - /webjars/**
    jwt-secret: ${APP_JWT_SECRET:zhixuewuli-default-secret-for-dev-only}

# AI 业务配置 (对应 AIBusinessProperties)
ai:
  agent:
    tool-calling-enabled: ${AI_AGENT_TOOL_CALLING_ENABLED:false}
    base-url: ${AI_AGENT_BASE_URL:}
    api-key: ${AI_AGENT_API_KEY:}
    model: ${AI_AGENT_MODEL:}
    timeout-seconds: ${AI_AGENT_TIMEOUT_SECONDS:30}
  learning-assistant:
    mode: ${AI_LEARNING_ASSISTANT_MODE:WORKFLOW}
    max-model-rounds: ${AI_LEARNING_ASSISTANT_MAX_MODEL_ROUNDS:6}
    max-tool-calls: ${AI_LEARNING_ASSISTANT_MAX_TOOL_CALLS:8}
    total-deadline-seconds: ${AI_LEARNING_ASSISTANT_DEADLINE_SECONDS:60}
    model-timeout-seconds: ${AI_LEARNING_ASSISTANT_MODEL_TIMEOUT_SECONDS:25}
    tool-timeout-seconds: ${AI_LEARNING_ASSISTANT_TOOL_TIMEOUT_SECONDS:5}
  context:
    # 总开关（对应 AIBusinessProperties.enabled）；敏感密钥只放本地 .env，不入库。
    # application-dev.yml / application-prod.yml 可覆盖默认值。
    enabled: ${AI_ENABLED:false}
    # 上下文管理配置
    max-history-count: 15
    max-token-count: 1500000
    session-expiration: 24h
    cleanup-interval: 10m
    context-background: "你是一名经验丰富的高中物理教师，擅长用通俗易懂的方式讲解复杂的物理概念。你的职责是帮助学生理解物理知识，解决学生困惑，并提供针对性的学习建议。请用中文回答，语气要亲切、专业、有耐心。涉及公式的部分，统一使用标准规范的LaTeX格式，例如将所有Unicode箭头替换为LaTeX命令，并且确保公式边界清晰，如应该写成\\cdot t而非\\cdott。"
    teacher-question-analysis-default-prompt: "请总结归纳学生本题的学习情况，从以下几个角度关注：\r\n1、整体掌握情况（包括正确率、理解程度或学生成绩与掌握情况在班级里的分布等）\r\n2、结合选项分布和答题情况分析典型错误思考模式，不推测学生未提供的主观想法\r\n3、教学应对建议（包括针对性纠错策略和核心强化知识点与教学方法提示）\r\n4、鼓励在回答中体现具体数据支撑"

    # 模型配置 (智谱免费档)
    real-time-qa-model: "glm-4.1v-thinking-flash"
    wrong-question-analysis-model: "glm-4.1v-thinking-flash"
    # 文字复盘使用实测响应更快的免费模型，避免 GLM-4.7-Flash 高峰期排队
    teacher-report-generation-model: "glm-4-flash-250414"
    student-report-generation-model: "glm-4-flash-250414"

    # 通用参数
    temperature: 0.6
    max-tokens: 8192

    # 报告生成复用智谱免费档；未设置或留空时由 AIBusinessProperties 回退到智谱 Key
    aliyun-api-key: ${ALIYUN_AI_API_KEY:}
    aliyun-base-url: "https://open.bigmodel.cn/api/paas/v4"
    aliyun-default-model: "glm-4-flash-250414"
    aliyun-temperature: 0.7
    aliyun-max-tokens: 6144


    # 智谱AI配置 (优先使用 *_AI_API_KEY，兼容旧变量名)
    zhipu-api-key: ${ZHIPU_AI_API_KEY:${ZHIPU_API_KEY:}}
    zhipu-base-url: "https://open.bigmodel.cn/api/paas/v4"
    zhipu-default-model: "glm-4.1v-thinking-flash"
    zhipu-temperature: 0.3
    zhipu-max-tokens: 8192
    zhipu-enable-reasoning: true

  # AI流式服务配置 (对应 AIStreamingProperties)
  streaming:
    # 超时配置
    call-timeout: 300000
    connect-timeout: 10000
    read-timeout: 60000
    write-timeout: 40000

    # 连接池配置
    max-idle-connections: 10
    keep-alive-duration: 5

    # 可靠性配置
    auto-reconnect: true

    # 数据处理配置
    buffer-size: 8192

    # 并发控制配置
    max-concurrent-requests: 32
    max-requests-per-host: 16

    # SSE配置
    sse-emitter-timeout: 300000
    sse-reconnect-time: 3000

    # 线程池配置
    ai-core-pool-size: 10
    ai-max-pool-size: 50
    ai-queue-capacity: 200
    ai-thread-name-prefix: "ai-task-"
    
    # SSE 连接数限制配置
    max-sse-connections: 32
