spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:zhixuewuli}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 3
      maximum-pool-size: 12
      idle-timeout: 180000
      max-lifetime: 900000
      connection-timeout: 30000
      validation-timeout: 2000
      leak-detection-threshold: 30000
      pool-name: ZhixuewuliHikariCP-Prod
      register-mbeans: false
  jpa:
    hibernate:
      ddl-auto: validate                # 显式指定，与主配置一致，但保留以强调生产行为

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never

# 生产环境API密钥从环境变量注入（不留默认值）
ai:
  context:
    enabled: ${AI_ENABLED:true}
    aliyun-api-key: ${ALIYUN_AI_API_KEY}
    zhipu-api-key: ${ZHIPU_AI_API_KEY}

app:
  security:
    jwt-secret: ${APP_JWT_SECRET}
    cors-allowed-origins:
      - "${APP_CORS_ALLOWED_ORIGIN:http://localhost}"
    cors-allow-credentials: true

logging:
  level:
    com.zhixuewuli: WARN
    com.zaxxer.hikari: WARN
    org.hibernate: WARN
