spring:
  datasource:
    url: ${MYSQL_TEST_URL:jdbc:mysql://127.0.0.1:3306/zhixuewuli?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_TEST_USER:root}
    password: ${MYSQL_TEST_PASSWORD:test-root-password}
  jpa:
    hibernate:
      ddl-auto: validate
  # MySQL 集成测试不连接 broker；消息语义测试使用独立配置覆盖。
  rabbitmq:
    listener:
      simple:
        auto-startup: false
management:
  health:
    rabbit:
      enabled: false
app:
  report-batch:
    enabled: false
  security:
    jwt-secret: mysql-integration-test-secret-never-use-in-production
  video:
    storage-path: ${java.io.tmpdir}/physics-mysql-test
    access-path: /videos
    max-file-size: 524288000
ai:
  context:
    aliyun-api-key: test-not-real
    zhipu-api-key: test-not-real
logging:
  level:
    root: WARN
