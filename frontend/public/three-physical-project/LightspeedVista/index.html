<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>相对论视觉模拟器 - 光行差 & 多普勒效应</title>
    <link rel="stylesheet" href="../Shared/color.css">
    <link rel="stylesheet" href="../Shared/theme.css">
    <link rel="stylesheet" href="../Shared/style.css">
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>
    <canvas id="c"></canvas>

    <div id="top-center-container">
        <div id="ai-panel" class="panel">
            <details open>
                <summary>
                    <primary>🤖 AI 实验助教</primary>
                </summary>
                <p id="ai-text">欢迎来到相对论视觉模拟器！调节左侧速度滑块，观察高速运动下的光行差与多普勒效应。鼠标可自由旋转视角。</p>
            </details>
        </div>
    </div>

    <div id="left-panel">
        <div id="ui-panel" class="panel">
            <details open>
                <summary style="color: var(--theme-primary); font-weight: bold;">🚀 相对论参数控制台</summary>

                <div class="control-group" style="border-top: none;">
                    <label>速度比率 β = v/c : <span class="val" id="speedValue">0.0000</span></label>
                    <input type="range" id="speedSlider" min="0" max="0.9999" step="0.0001" value="0">
                </div>

                <div class="control-group">
                    <button id="autoAccelerateBtn" class="orbit-btn" style="margin-bottom: 10px;">🚀 缓变加速</button>
                    <button id="rapidAccelerateBtn" class="orbit-btn">⚡
                        急变加速</button>
                </div>
            </details>
        </div>
    </div>

    <div id="right-panel">
        <div id="chart-panel" class="panel">
            <details open>
                <summary style="color: var(--theme-primary); font-weight: bold;">📊 实时遥测数据</summary>
                <table class="data-table">
                    <tr>
                        <td style="color: var(--theme-secondary);">当前速度</td>
                        <td id="speedDisplay">0.000c</td>
                    </tr>
                    <tr>
                        <td style="color: var(--theme-secondary);">多普勒强度</td>
                        <td><progress id="dopplerProgress" value="0" max="1"></progress> <span
                                id="dopplerValue">0%</span></td>
                    </tr>
                    <tr>
                        <td style="color: var(--theme-secondary);">光行差临界角 θ<sub>c</sub></td>
                        <td id="aberrationAngle">90°</td>
                    </tr>
                    <tr>
                        <td style="color: var(--theme-secondary);">时间膨胀因子 γ</td>
                        <td id="gamma">1.000</td>
                    </tr>
                </table>

            </details>
        </div>
    </div>

    <script type="module" src="main.js"></script>
</body>

</html>
