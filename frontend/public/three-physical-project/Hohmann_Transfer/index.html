<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>高阶引力变轨3D模拟实验</title>
    <link rel="stylesheet" href="../Shared/style.css">
    <link rel="stylesheet" href="../Shared/color.css">
    <script type="importmap">
    { 
        "imports": { 
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        } 
    }
    </script>
</head>

<body>
    <canvas id="c"></canvas>

    <div id="top-center-container">
        <div id="ai-panel" class="panel">
            <details open>
                <summary>
                    <primary>🤖 AI 实验助教</primary>
                </summary>
                <p id="ai-text">系统启动完成！已加载引力势井网格。请设定目标高度，并在合适位置点击第一次点火。</p>
            </details>
        </div>
    </div>

    <div id="left-panel" style="display: flex; flex-direction: column; height: 90vh;">
        <div class="panel">
            <details open>
                <summary style="color: var(--theme-primary);">🪐 变轨控制台</summary>
                <div class="control-group" style="border-top: none;">
                    <label>🎯 目标轨道半径 (r<sub>2</sub>): 
                        <span class="val">
                            <span id="val-r2">4.0</span>
                            <span style="color: #fff; font-size: 0.9em; margin-left: 4px; font-weight: normal;">R<sub>E</sub></span>
                        </span>
                    </label>
                    <input type="range" id="slider-r2" min="2.5" max="6.0" value="4.0" step="0.1">
                </div>
                <div class="control-group">
                    <label>⏱️ 时间流速: <span class="val" id="val-speed">1.0x</span></label>
                    <input type="range" id="slider-speed" min="0.1" max="3.0" value="1.0" step="0.1">
                </div>
                <div style="margin-top: 15px;">
                    <button id="btn-burn1" class="orbit-btn"
                        style="border-color: var(--theme-orange); color: var(--theme-text);">🔥 第 1 次点火 (A点切入)</button>
                    <button id="btn-burn2" class="orbit-btn" style="border-color: #555; color: #555; background: #222;"
                        disabled>🛑 第 2 次点火 (B点圆化)</button>
                    <div style="display: flex; gap: 10px; margin-top:5px;">
                        <button id="btn-camera-mode" class="mode-btn"
                            style="flex: 1; border-color: var(--theme-green); color:var(--theme-text);">👁️
                            追踪视角</button>
                        <button id="btn-reset" class="mode-btn"
                            style="flex: 1; border-color: var(--theme-green); color: var(--theme-text);">🔄 重置</button>
                    </div>
                </div>
            </details>
        </div>

        <div id="log-panel-wrapper" style="display: flex; flex-direction: column; flex: 1; transition: all 0.3s;">
            <details id="log-panel" class="panel" open
                style="display: flex; flex-direction: column; flex: 1; margin-bottom: 0; overflow: hidden;" ontoggle="
                    const isOpacity = this.open;
                    this.style.flex = isOpacity ? '1' : 'none';
                    this.style.padding = isOpacity ? '24px' : '10px 24px';
                    this.parentElement.style.flex = isOpacity ? '1' : 'none';
                ">
                <summary style="color: var(--theme-primary); font-weight: bold; cursor: pointer;">📝 飞行日志</summary>

                <div id="log-container"
                    style="flex: 1; overflow-y: auto; margin-top: 10px; border-top: 1px solid rgba(255,170,0,0.2); padding-top: 10px; min-height: 100px; font-size: 16px;">
                </div>
            </details>
        </div>
    </div>

    <div id="right-panel">
        <div class="panel">
            <details open>
                <summary style="color: var(--theme-primary);">📊 实时遥测</summary>
                <table class="data-table">
                    <tr>
                        <td style="color: var(--theme-secondary);">当前半径 (r)</td>
                        <td id="data-r">4.00</td>
                        <td>R<sub>E</sub></td>
                    </tr>
                    <tr>
                        <td style="color: var(--theme-secondary);">瞬时速度 (v)</td>
                        <td id="data-v">3.95</td>
                        <td>km/s</td>
                    </tr>
                    <tr>
                        <td style="color: var(--theme-secondary);">累计速度损耗 (&Sigma;&Delta;v)</td>
                        <td id="data-dv">0.00</td>
                        <td>km/s</td>
                    </tr>
                </table>
                <div style="font-size: 12px; color: #ccc; margin-top: 10px; border-top: 1px dashed rgba(255,255,255,0.2); padding-top: 8px; line-height: 1.5;">
                    注：R<sub>E</sub> 为地球平均半径，约等于 6371 km。
                </div>
            </details>
        </div>

        <div class="panel" style="margin-top: 10px;">
            <details open>
                <summary style="color: var(--theme-primary);">📚 经典变轨速度分析</summary>
                <div style="font-size: 12px; color: #ccc; margin-top: 5px;">
                    根据开普勒定律及能量守恒验证：
                </div>
                <table class="data-table" style="margin-top: 8px;">
                    <tr>
                        <td style="color: var(--theme-secondary);">v<sub>1</sub> (原轨线速度)</td>
                        <td id="data-v1">--</td>
                    </tr>
                    <tr>
                        <td style="color: var(--theme-secondary);">v<sub>2</sub> (A点点火后)</td>
                        <td id="data-v2">--</td>
                    </tr>
                    <tr>
                        <td style="color: var(--theme-secondary);">v<sub>3</sub> (B点点火前)</td>
                        <td id="data-v3">--</td>
                    </tr>
                    <tr>
                        <td style="color: var(--theme-secondary);">v<sub>4</sub> (目标轨速度)</td>
                        <td id="data-v4">--</td>
                    </tr>
                </table>
                <div style="margin-top:10px; font-size:14px; text-align: center; color: #fff; font-weight: bold;"
                    id="physics-conclusion">
                    结论: 等待点火...
                </div>
            </details>
        </div>
    </div>

    <script type="module" src="main.js"></script>
</body>

</html>
