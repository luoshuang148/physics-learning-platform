<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>量子力学 - 光电效应</title>
    <link rel="stylesheet" href="../Shared/color.css">
    <link rel="stylesheet" href="../Shared/theme.css">
    <link rel="stylesheet" href="../Shared/style.css">
    <script type="importmap">
            {
                "imports": {
                    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
                }
            }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>

<body>
    <canvas id="c"></canvas>

    <div id="top-center-container">
        <div id="ai-panel" class="panel">
            <details open>
                <summary><span class="ai-icon">🤖</span>
                    <primary>AI 实验助教</primary>
                </summary>
                <p id="ai-text">欢迎来到光电效应实验。请尝试调节入射光的频率，观察光电流的变化以及截止电压的产生。</p>
            </details>
        </div>
    </div>

    <div id="left-panel">
        <div id="ui-panel" class="panel">
            <details open>
                <summary style="color: var(--theme-primary); font-weight: bold;">💡 光源与电压控制台</summary>
                <div class="control-group" style="border-top: none;">
                    <label>入射光特征: <span class="val" id="val-freq"></span></label>
                    <input type="range" id="slider-freq" min="4.0" max="15.0" value="5.0" step="0.1">
                </div>
                <div class="control-group">
                    <label>光照强度 (决定光束里的光子数量): <span class="val" id="val-intensity">100</span> W/m²</label>
                    <input type="range" id="slider-intensity" min="0" max="500" value="100" step="10">
                </div>
                <div class="control-group"
                    style="border-top: 1px dashed rgba(255,255,255,0.3); margin-top: 15px; padding-top: 15px;">
                    <label>外加偏置电压 (调节两极板间的电场): <span class="val" id="val-voltage">0.00 V</span></label>
                    <input type="range" id="slider-voltage" min="-4.0" max="4.0" value="0.0" step="0.05">
                </div>
                <div class="control-group"
                    style="border-bottom: 1px dashed rgba(255,255,255,0.3); margin-bottom: 15px; padding-bottom: 15px;">
                    <label>阴极金属材料:</label>
                    <select id="select-metal"
                        style="width: 100%; padding: 6px; background: var(--theme-button-bg); color: var(--theme-text); border: 1px solid var(--theme-button-border); border-radius: 4px; margin-top: 8px; font-family: inherit; outline: none; cursor: pointer;">
                        <option value="cesium">铯 (Cs) - W = 1.93 eV (极易激发)</option>
                        <option value="sodium" selected>钠 (Na) - W = 2.28 eV (常规材料)</option>
                        <option value="zinc">锌 (Zn) - W = 4.33 eV (需紫外线)</option>
                        <option value="platinum">铂 (Pt) - W = 6.35 eV (极难激发)</option>
                    </select>
                </div>
            </details>
        </div>
        <div id="log-panel" class="panel" style="flex: 1; display: flex; flex-direction: column; overflow: hidden;">
            <details open style="display: flex; flex-direction: column; flex: 1;">
                <summary style="color: var(--theme-primary); font-weight: bold;">📝 实验操作记录</summary>
                <div id="log-container"
                    style="height: 220px; overflow-y: auto; overscroll-behavior: contain; pointer-events: auto; margin-top: 10px; border-top: 1px solid rgba(255,170,0,0.2); padding-top: 10px;">
                    <div class="log-item"><span class="time"
                            style="color: #888; font-size: 11px; margin-right: 8px;">[系统]</span><span
                            class="log-content">等待实验数据输入...</span></div>
                </div>

                <style>
                    #log-container::-webkit-scrollbar {
                        width: 6px;
                    }

                    #log-container::-webkit-scrollbar-track {
                        background: rgba(0, 0, 0, 0.3);
                        border-radius: 4px;
                    }

                    #log-container::-webkit-scrollbar-thumb {
                        background: rgba(255, 170, 0, 0.5);
                        border-radius: 4px;
                    }

                    #log-container::-webkit-scrollbar-thumb:hover {
                        background: rgba(255, 170, 0, 0.8);
                    }
                </style>
            </details>
        </div>
    </div>

    <div id="right-panel">
        <div id="chart-panel" class="panel">
            <details open>
                <summary style="color: var(--theme-primary); font-weight: bold;">📈 I-U 光电流曲线</summary>
                <p style="font-size: 11px; color: #aaa; margin: 0;">横轴: 施加电压 U | 纵轴: 光电流 I</p>
                <canvas id="iv-chart" class="data-chart"></canvas>
                <div class="data-text">
                    <div id="stop-voltage" style="margin-bottom: 8px;">反向截止电压: -0.00 V</div>
                    <div id="max-current">回路实时电流: 0.00 μA</div>
                </div>
            </details>
        </div>
    </div>

    <script type="module" src="main.js"></script>
</body>

</html>
