<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>宇宙航天 - 三大宇宙速度</title>
    <link rel="stylesheet" href="../Shared/color.css">
    <link rel="stylesheet" href="../Shared/theme.css">
    <link rel="stylesheet" href="../Shared/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>

<body>
    <canvas id="c"></canvas>

    <div id="top-center-container">
        <div id="ai-panel" class="panel">
            <details open>
                <summary><span class="ai-icon">🤖</span>
                    <primary>AI 实验助教</primary>
                </summary>
                <p id="ai-text">调节发射初速度，观察飞船的轨道形状如何从椭圆变成抛物线，甚至双曲线逃逸！</p>
            </details>
        </div>
    </div>

    <div id="left-panel">
        <div id="ui-panel" class="panel panel-collapse" style="flex: 0 0 auto;">
            <details id="ui-details" open>
                <summary style="color: var(--theme-primary); font-weight: bold;">☄️ 初速度发射台</summary>
                <div class="control-group" style="border-top: none;">
                    <label>发射初速度 v0 (km/s): <span class="val" id="val-v0"
                            style="color: var(--theme-orange);">5.0</span></label>
                    <input type="range" id="slider-v" min="5.0" max="7.8" value="5.0" step="0.1">
                    <div style="display:flex; gap:8px; flex-wrap: wrap; margin-top: 10px;">
                        <button id="btn-launch" class="pill-btn">发射</button>
                        <button id="btn-reset" class="pill-btn">重置</button>
                    </div>
                    <div style="display:flex; gap:8px; flex-wrap: wrap; margin-top: 10px;">
                        <button id="btn-stage-1" class="pill-btn">第一宇宙速度以下</button>
                        <button id="btn-stage-2" class="pill-btn">第一~第二宇宙速度</button>
                        <button id="btn-stage-3" class="pill-btn">第二~第三宇宙速度</button>
                        <button id="btn-stage-4" class="pill-btn">第三宇宙速度以上</button>
                    </div>
                    <div style="margin-top:8px;padding:6px 8px;border:1px dashed rgba(120,210,255,0.55);border-radius:8px;font-size:12px;color:#9fe4ff;line-height:1.5;">
                        标注：实验中飞船发射方向均设为与地球绕太阳公转方向一致（顺向发射）。
                    </div>
                </div>
                <div class="control-group">
                    <label>演示速率: <span class="val" id="val-time-scale"
                            style="color: var(--theme-secondary);">30x</span></label>
                    <input type="range" id="slider-time" min="1" max="120" value="30" step="1">
                </div>
            </details>
        </div>

        <div id="log-panel" class="panel panel-collapse" style="display: flex; flex-direction: column; overflow: hidden;">
            <details id="log-details" style="display: flex; flex-direction: column; flex: 1;">
                <summary style="color: var(--theme-primary); font-weight: bold;">📝 发射状态记录</summary>
                <div id="log-container"
                    style="max-height: 250px; overflow-y: auto; margin-top: 10px; border-top: 1px solid rgba(255,170,0,0.2); padding-top: 10px;">
                </div>
            </details>
        </div>
    </div>

    <div id="right-panel">
        <div id="chart-panel" class="panel">
            <details open>
                <summary style="color: var(--theme-primary); font-weight: bold;">📋 轨道特征诊断</summary>
                <div class="data-text">
                    <p>当前轨道类型: <strong id="orbit-type" style="color: var(--theme-green); font-size: 15px;">正圆轨道
                            (环绕)</strong></p>
                    <hr style="border: 0; border-top: 1px dashed rgba(255,255,255,0.2); margin: 10px 0;">
                    <p>轨道偏心率 e: <strong id="val-e">0.00</strong></p>
                    <p>近地点高度: <span id="val-peri">0 km</span></p>
                    <p>远地点高度: <span id="val-apo">0 km</span></p>
                    <p>瞬时速度: <strong id="val-speed">0.00 km/s</strong></p>
                    <p>比机械能 ε: <strong id="val-energy">0.000 km<sup>2</sup>/s<sup>2</sup></strong></p>
                    <p>比角动量 h: <strong id="val-angmom">0.000 km<sup>2</sup>/s</strong></p>
                    <p style="margin-top: 15px;">系统引力束缚: <strong id="system-status"
                            style="color:var(--theme-accent);">未逃逸地球</strong></p>
                </div>
            </details>
        </div>

        <div id="result-panel" class="panel" style="margin-top: 10px;">
            <details open>
                <summary style="color: var(--theme-primary); font-weight: bold;">🧪 实验结果卡</summary>
                <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;">

                    <span id="result-count"
                        style="font-size:12px;color:var(--theme-secondary);align-self:center;">记录数：0</span>
                </div>
                <div id="result-list"
                    style="max-height:240px;overflow-y:auto;margin-top:10px;border-top:1px solid rgba(88,200,255,0.25);padding-top:8px;">
                </div>
            </details>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module" src="main.js"></script>
</body>

</html>
