<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>量子力学 - 电子云与不确定性</title>
    <link rel="stylesheet" href="../Shared/color.css">
    <link rel="stylesheet" href="../Shared/theme.css">
    <link rel="stylesheet" href="../Shared/style.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>

<body>
    <canvas id="c"></canvas>

    <div id="top-center-container">
        <div id="ai-panel" class="panel">
            <details open>
                <summary><span class="ai-icon">🤖</span>
                    <primary>AI 实验助教</primary>
                </summary>
                <p id="ai-text">系统已就绪，等待实验指令...</p>
            </details>
        </div>
    </div>

    <div id="left-panel">
        <div id="ui-panel" class="panel">
            <details open>
                <summary style="color: var(--theme-primary); font-weight: bold; cursor: pointer; margin-bottom: 10px;">
                    🌌 量子轨道控制台
                </summary>
                <button id="btn-1s" class="orbit-btn">1s 轨道 (球状)</button>
                <button id="btn-2p" class="orbit-btn">2p 轨道 (哑铃状)</button>
                <button id="btn-3d" class="orbit-btn">3d 轨道 (梅花状)</button>

                <h3 style="margin-top: 20px; color: var(--theme-secondary); font-size: 16px;">🔬 观测模式</h3>
                <div class="mode-container">
                    <button id="btn-mode-cloud" class="mode-btn active">全貌概率云</button>
                    <button id="btn-mode-trace" class="mode-btn">单电子追踪</button>
                </div>

                <div class="control-group">
                    <label style="color: var(--theme-secondary);">🔪 剖切深度 (观察内部结构):</label>
                    <input type="range" id="slice-slider" min="-30" max="30" value="30" step="0.5">
                </div>
            </details>
        </div>
        <div id="log-panel" class="panel">
            <details open>
                <summary style="color: var(--theme-primary); font-weight: bold; cursor: pointer;">📝 实验操作记录</summary>
                <div id="log-container"
                    style="max-height: 250px; overflow-y: auto; margin-top: 10px; border-top: 1px solid rgba(255,170,0,0.2); padding-top: 10px;">
                    <div class="log-item"><span class="time">[系统]</span> 等待实验数据输入...</div>
                </div>
            </details>
        </div>
    </div>

    <div id="right-panel" style="top: 20px; bottom: auto;">
        <div id="chart-panel" class="panel">
            <details open>
                <summary style="color: var(--theme-primary); font-weight: bold; cursor: pointer; margin-bottom: 10px;">
                    📊
                    径向概率密度 P(r)
                </summary>
                <p style="font-size: 11px; color: #aaa;">横轴: 距核距离 r | 纵轴: 出现概率</p>
                <canvas id="prob-chart" width="200" height="150"></canvas>
            </details>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module" src="main.js"></script>
</body>

</html>
