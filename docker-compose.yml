services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zhixuewuli-network

  # MySQL 数据库服务
  mysql:
    image: mysql:8.4
    container_name: zhixuewuli-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: zhixuewuli
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:3306:3306"   # 仅允许本机访问，提高安全性
    volumes:
      # MySQL 数据持久化到数据盘
      - /data/mysql:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --performance-schema=0          # 关闭性能监控以节省内存
      - --innodb-buffer-pool-size=128M  # 限制缓冲池大小
      - --max-connections=50
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - zhixuewuli-network

  # RabbitMQ：批量学生报告的可靠消息队列（Outbox + 手动确认 + 死信）
  rabbitmq:
    image: rabbitmq:3.13-alpine
    container_name: zhixuewuli-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-zhixuewuli}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-replace_with_rabbitmq_password}
    ports:
      - "127.0.0.1:5672:5672"   # 仅允许本机访问，提高安全性
    volumes:
      - /data/rabbitmq:/var/lib/rabbitmq
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - zhixuewuli-network

  # Optional local vector index; keep it off unless the knowledge feature is enabled.
  qdrant:
    image: qdrant/qdrant:v1.19.2
    profiles: ["knowledge"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - /data/qdrant:/qdrant/storage
    mem_limit: 512m
    networks:
      - zhixuewuli-network

  # Spring Boot 应用服务
  app:
    # 单机部署默认本地构建镜像，也支持通过 APP_IMAGE 覆盖标签
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_APP_BASE: ${VITE_APP_BASE:-/api/v1/}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    image: ${APP_IMAGE:-zhixuewuli-app:1.0.0}
    container_name: zhixuewuli-app
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: "jdbc:mysql://${DB_HOST:-mysql}:${DB_PORT:-3306}/${DB_NAME:-zhixuewuli}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci"
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USER:-zhixuewuli}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-replace_with_rabbitmq_password}
      REPORT_BATCH_ENABLED: ${REPORT_BATCH_ENABLED:-true}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: zhixuewuli
      ALIYUN_AI_API_KEY: ${ALIYUN_AI_API_KEY}
      ZHIPU_AI_API_KEY: ${ZHIPU_AI_API_KEY}
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      APP_CORS_ALLOWED_ORIGIN: ${APP_CORS_ALLOWED_ORIGIN}
      VIDEO_STORAGE_PATH: /data/videos
      AI_ENABLED: ${AI_ENABLED:-true}
      APP_KNOWLEDGE_ENABLED: ${APP_KNOWLEDGE_ENABLED:-false}
      APP_KNOWLEDGE_QDRANT_URL: ${APP_KNOWLEDGE_QDRANT_URL:-http://qdrant:6333}
      AI_LEARNING_ASSISTANT_MODE: ${AI_LEARNING_ASSISTANT_MODE:-WORKFLOW}
      AI_AGENT_TOOL_CALLING_ENABLED: ${AI_AGENT_TOOL_CALLING_ENABLED:-false}
      AI_AGENT_BASE_URL: ${AI_AGENT_BASE_URL:-}
      AI_AGENT_API_KEY: ${AI_AGENT_API_KEY:-}
      AI_AGENT_MODEL: ${AI_AGENT_MODEL:-}
      BOOTSTRAP_TEACHER_ENABLED: ${BOOTSTRAP_TEACHER_ENABLED:-false}
      BOOTSTRAP_TEACHER_USERNAME: ${BOOTSTRAP_TEACHER_USERNAME:-}
      BOOTSTRAP_TEACHER_PASSWORD: ${BOOTSTRAP_TEACHER_PASSWORD:-}
      SERVER_PORT: 8080
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx448m -XX:+UseG1GC -XX:+UseContainerSupport}
    ports:
      - "${PUBLIC_PORT:-80}:8080"
    volumes:
      # 整体挂载宿主机 /data 到容器 /data，所有子目录自动持久化
      - /data:/data
    mem_limit: 700m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - zhixuewuli-network

networks:
  zhixuewuli-network:
    driver: bridge
