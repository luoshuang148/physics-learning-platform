name: Bug report
description: 报告缺陷，帮助我们定位并修复问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量填写完整，便于我们复现。
  - type: textarea
    id: what-happened
    attributes:
      label: 问题描述
      description: 实际发生了什么？
      placeholder: 简洁描述现象与影响
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 从什么入口开始，点了什么，看到什么
      placeholder: |
        1. 以学生账号登录
        2. 打开「错题本」
        3. ……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      description: 操作系统、JDK、Node、MySQL、浏览器等
      placeholder: |
        - OS: macOS 15
        - JDK: 21
        - Node: 22
        - MySQL: 8.0.36
        - Browser: Chrome 131
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图
      description: 请脱敏后粘贴相关日志或截图
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 已搜索现有 Issue，确认问题未被重复报告
          required: true
        - label: 日志与截图中不包含密钥、令牌或真实用户数据
          required: true
