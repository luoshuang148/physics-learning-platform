name: Feature request
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提出想法。请先描述场景，再谈方案。
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 谁在什么情况下需要这个能力？解决什么问题？
      placeholder: 例如：教师希望在发布作业后批量导出未交名单，用于线下点名。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
      description: 界面交互、接口形态或数据结构上的设想
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 目前你是怎么绕过这个问题的？还有哪些可选做法？
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - 学生端
        - 教师端
        - 后端 API / 数据模型
        - AI 能力
        - 部署 / 运维
        - 文档
        - 其他
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 已搜索现有 Issue，确认建议未被重复提出
          required: true
