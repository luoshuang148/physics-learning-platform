name: Verify backend and frontend
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-reports
          path: target/surefire-reports
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test-root-password
          MYSQL_DATABASE: zhixuewuli
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptest-root-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Initialize fresh schema
        run: docker exec -i ${{ job.services.mysql.id }} mysql -uroot -ptest-root-password < src/main/resources/sql/schema_init.sql
      - name: Verify fresh schema against MySQL 8.4
        run: ./mvnw -B test -Dgroups=mysql -DexcludedGroups=external-api
      - name: Restore legacy fixture and apply non-destructive upgrade
        run: |
          docker exec -i ${{ job.services.mysql.id }} mysql -uroot -ptest-root-password < src/test/resources/mysql/schema-v1.sql
          docker exec -i ${{ job.services.mysql.id }} mysql -uroot -ptest-root-password zhixuewuli < src/main/resources/sql/upgrades/V2__archive_teaching_events.sql
      - name: Verify upgraded schema against MySQL 8.4
        run: ./mvnw -B test -Dgroups=mysql -DexcludedGroups=external-api
